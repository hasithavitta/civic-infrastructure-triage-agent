<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civic Infrastructure Triage Agent</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 16px;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 14px;
    }

    label:first-child {
      margin-top: 0;
    }

    textarea,
    input[type="text"],
    input[type="password"],
    input[type="file"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 14px;
      min-height: 1.2em;
    }

    .error {
      color: var(--red);
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .result-row .k {
      color: var(--muted);
      flex-shrink: 0;
    }

    .result-row .v {
      text-align: right;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.8rem;
      color: #0f172a;
    }

    .work-order {
      margin-top: 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .hidden {
      display: none;
    }

    .disclosure {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Civic Infrastructure Triage Agent</h1>
    <div class="subtitle">Multi-agent system for reporting and triaging civic issues in real time.</div>

    <div class="panel">
      <label for="rawText">Describe the issue</label>
      <textarea id="rawText"
        placeholder="e.g. There's a broken streetlight on Somajiguda main road, Hyderabad."></textarea>

      <label for="imageFile">Photo (optional)</label>
      <input type="file" id="imageFile" accept="image/*" />

      <button id="submitBtn">Submit Report</button>
      <div class="status" id="status"></div>
      <div class="disclosure">Uses a shared, rate-limited demo API key.</div>
    </div>

    <div class="panel hidden" id="resultPanel"></div>
  </div>

  <script>
    const API_URL = 'https://civic-infrastructure-triage-agent.onrender.com/triage';
    const API_KEY = 'NjKAawdZoDuBwEU9U4JKK8ZIr9jijJyE5mNRu1gsKEU';

    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');
    const resultPanel = document.getElementById('resultPanel');

    function severityColor(score) {
      if (score >= 4) return 'var(--red)';
      if (score >= 3) return 'var(--yellow)';
      return 'var(--green)';
    }

    function row(k, v) {
      return `<div class="result-row"><div class="k">${k}</div><div class="v">${v}</div></div>`;
    }

    function renderResult(data) {
      const sevColor = severityColor(data.severity_score ?? 0);
      let html = '';
      html += row('Issue type', data.issue_type ?? '—');
      html += row('Description', data.description ?? '—');
      html += row('Address', data.address ?? '—');
      html += row('Severity', `<span class="badge" style="background:${sevColor}">${data.severity_score ?? '—'}/5</span>`);
      html += row('Department', data.department ?? '—');
      html += row('Duplicate?', data.is_duplicate ? 'Yes' : 'No');
      if (data.severity_reasoning) {
        html += `<div class="work-order"><strong style="color:var(--text)">Severity reasoning:</strong>\n${data.severity_reasoning}</div>`;
      }
      if (data.work_order_text) {
        html += `<div class="work-order"><strong style="color:var(--text)">Work order:</strong>\n${data.work_order_text}</div>`;
      }
      resultPanel.innerHTML = html;
      resultPanel.classList.remove('hidden');
    }

    submitBtn.addEventListener('click', async () => {
      const rawText = document.getElementById('rawText').value.trim();
      const imageFile = document.getElementById('imageFile').files[0];

      if (!rawText && !imageFile) {
        statusEl.textContent = 'Please enter a description.';
        statusEl.className = 'status error';
        return;
      }

      const formData = new FormData();
      formData.append('raw_text', rawText);
      if (imageFile) formData.append('image', imageFile);

      submitBtn.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = 'Running triage — geocoding, severity scoring, duplicate check…';
      resultPanel.classList.add('hidden');

      try {
        const headers = {};
        if (API_KEY) headers['X-API-Key'] = API_KEY;

        const response = await fetch(API_URL, {
          method: 'POST',
          headers,
          body: formData
        });

        if (!response.ok) {
          throw new Error(`Server responded with ${response.status}`);
        }

        const data = await response.json();
        statusEl.textContent = '';
        renderResult(data);
      } catch (err) {
        statusEl.className = 'status error';
        if (err.message.includes('Failed to fetch')) {
          statusEl.textContent = 'Network/CORS error — check the API URL and that CORS is enabled on the backend.';
        } else {
          statusEl.textContent = `Error: ${err.message}`;
        }
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
